[package]
name = "sqlite-workload-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reproducible SQLite workload and CPU-compatibility evidence"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-sqlite-workload-lab"
homepage = "https://sqlite-workload-lab.sociobot.in"
readme = "README.md"
keywords = ["sqlite", "benchmark", "cli", "reproducibility"]
categories = ["command-line-utilities", "development-tools::profiling"]

[[bin]]
name = "sqlite-workload-lab"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.46", features = ["derive"] }
rusqlite = { version = "0.37.0", features = ["bundled-full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tempfile = "3.21.0"
toml = "0.9.5"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
